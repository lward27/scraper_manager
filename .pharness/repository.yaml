api_version: pharness.dev/v1alpha1
environment_profile: python-3.11
dependency_lock:
  kind: pip_requirements
  path: requirements.lock
  sha256: 92d7c3db851d19cf5eca15ce9aff2bdaadda46b6fd75287b3a60af84b0249f18
writable_paths:
- src/**
- tests/**
- README.md
- DEPLOYMENT.md
acceptance_commands:
- name: pytest
  command: python -m pytest -q
- name: compileall
  command: python -m compileall -q src tests
roots:
  source:
  - src
  tests:
  - tests
  documentation:
  - README.md
  - DEPLOYMENT.md
agent_network: denied
package_installation: preparation_only
