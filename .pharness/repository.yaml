api_version: pharness.dev/v1alpha1
environment_profile: python-3.11
dependency_lock:
  kind: pip_requirements
  path: requirements.lock
  sha256: 58bb5b7b1345d7923dfb1b6a6da24edb611a54325e82ddf3937cb8ffa8023ea5
writable_paths:
- src/**
- tests/**
- README.md
- DEPLOYMENT.md
acceptance_commands:
- name: pytest
  command: python -m pytest -q
- name: compileall
  command: python -m compileall -q src tests
roots:
  source:
  - src
  tests:
  - tests
  documentation:
  - README.md
  - DEPLOYMENT.md
agent_network: denied
package_installation: preparation_only
